services:
  logsight-api:
    build:
      context: .
      args:
        INSTALL_EXTRAS: api,redis,observability
    image: logsight-ai:enterprise
    entrypoint: []
    command: ["uvicorn", "logsight.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      LOGSIGHT_WINDOW: "500"
      LOGSIGHT_REDIS_URL: redis://redis:6379/0
      LOGSIGHT_RATE_LIMIT: "120"
      LOGSIGHT_RATE_WINDOW_SECONDS: "60"
      LOGSIGHT_DEDUP_TTL_SECONDS: "300"
      LOGSIGHT_OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: logsight-api
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_URL: http://clickhouse:8123
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      - kafka
      - clickhouse
      - qdrant
      - redis
      - otel-collector
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=32m,mode=1777

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/collector.yml"]
    volumes:
      - ./deploy/otel/collector.yml:/etc/otelcol-contrib/collector.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=32m,mode=1777

  kafka:
    image: redpandadata/redpanda:v25.2.1
    command: ["redpanda", "start", "--overprovisioned", "--smp=1", "--memory=1G", "--reserve-memory=0M", "--node-id=0", "--check=false"]
    ports:
      - "9092:9092"

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  clickhouse_data:
  qdrant_data:
  redis_data:
  grafana_data:
