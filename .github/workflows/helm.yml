name: Helm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/logsight-ai
      - run: helm template logsight-ai charts/logsight-ai --namespace logsight > rendered-manifests.yaml
      - name: Validate opt-in ServiceMonitor render
        run: |
          helm template logsight-ai charts/logsight-ai --namespace logsight \
            --set serviceMonitor.enabled=true \
            --set serviceMonitor.bearerTokenSecret.name=logsight-scrape-token \
            > rendered-servicemonitor.yaml
          grep -q 'kind: ServiceMonitor' rendered-servicemonitor.yaml
          grep -q 'name: logsight-scrape-token' rendered-servicemonitor.yaml
          if helm template logsight-ai charts/logsight-ai --namespace logsight \
            --set serviceMonitor.enabled=true > /dev/null 2>&1; then
            echo "ServiceMonitor accepted an empty token Secret reference"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: helm-manifests
          path: rendered-manifests.yaml
