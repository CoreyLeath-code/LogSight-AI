name: Helm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/logsight-ai
      - run: helm template logsight-ai charts/logsight-ai --namespace logsight > rendered-manifests.yaml
      - name: Validate opt-in ServiceMonitor render
        run: |
          helm template logsight-ai charts/logsight-ai --namespace logsight \
            --set serviceMonitor.enabled=true \
            --set serviceMonitor.bearerTokenSecret.name=logsight-scrape-token \
            > rendered-servicemonitor.yaml
          grep -q 'kind: ServiceMonitor' rendered-servicemonitor.yaml
          grep -q 'logsight-scrape-token' rendered-servicemonitor.yaml
          grep -q 'name: LOGSIGHT_API_AUTH_MODE' rendered-servicemonitor.yaml
          grep -q 'name: LOGSIGHT_API_TOKEN' rendered-servicemonitor.yaml
          grep -q 'secretKeyRef:' rendered-servicemonitor.yaml
          grep -q 'value: "token"' rendered-servicemonitor.yaml
          if helm template logsight-ai charts/logsight-ai --namespace logsight \
            --set serviceMonitor.enabled=true \
            --set serviceMonitor.bearerTokenSecret.name=logsight-scrape-token \
            --set serviceMonitor.bearerTokenSecret.key= > /dev/null 2>&1; then
            echo "ServiceMonitor accepted an empty Secret key"
            exit 1
          fi
          if helm template logsight-ai charts/logsight-ai --namespace logsight \
            --set serviceMonitor.enabled=true \
            --set serviceMonitor.bearerTokenSecret.name=logsight-scrape-token \
            --set env.LOGSIGHT_API_AUTH_MODE=disabled > /dev/null 2>&1; then
            echo "ServiceMonitor accepted unauthenticated API override"
            exit 1
          fi
          if helm template logsight-ai charts/logsight-ai --namespace logsight \
            --set serviceMonitor.enabled=true \
            --set serviceMonitor.bearerTokenSecret.name=logsight-scrape-token \
            --set extraEnv[0].name=LOGSIGHT_API_TOKEN \
            --set extraEnv[0].value=placeholder > /dev/null 2>&1; then
            echo "ServiceMonitor accepted duplicate API token override"
            exit 1
          fi
          if helm template logsight-ai charts/logsight-ai --namespace logsight \
            --set serviceMonitor.enabled=true > /dev/null 2>&1; then
            echo "ServiceMonitor accepted an empty token Secret reference"
            exit 1
          fi
      - name: Validate opt-in monitoring NetworkPolicy selector guards
        run: |
          helm template logsight-ai charts/logsight-ai --namespace logsight \
            --set serviceMonitor.enabled=true \
            --set serviceMonitor.bearerTokenSecret.name=logsight-scrape-token \
            --set networkPolicy.monitoringIngress.enabled=true \
            --set networkPolicy.monitoringIngress.namespaceLabels.kubernetes\\.io/metadata\\.name=monitoring \
            --set networkPolicy.monitoringIngress.podLabels.app=prometheus \
            > monitored-manifests.yaml
          grep -q 'kind: NetworkPolicy' monitored-manifests.yaml
          grep -q 'prometheus' monitored-manifests.yaml
          grep -q 'monitoring' monitored-manifests.yaml
          if helm template logsight-ai charts/logsight-ai --namespace logsight \
            --set networkPolicy.monitoringIngress.enabled=true > /dev/null 2>&1; then
            echo "Accepted monitoring ingress without ServiceMonitor or selectors"
            exit 1
          fi
          if helm template logsight-ai charts/logsight-ai --namespace logsight \
            --set serviceMonitor.enabled=true \
            --set serviceMonitor.bearerTokenSecret.name=logsight-scrape-token \
            --set networkPolicy.monitoringIngress.enabled=true > /dev/null 2>&1; then
            echo "Accepted monitoring ingress without explicit selectors"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: helm-manifests
          path: rendered-manifests.yaml
