[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logsight-ai"
version = "0.2.0"
description = "Production-grade log analysis, anomaly detection, and observability platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["logging", "anomaly-detection", "observability", "opentelemetry", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["click>=8.1.7", "rich>=13.7.0"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.7,<3"]
kafka = ["aiokafka>=0.10,<1"]
observability = ["opentelemetry-api>=1.25,<2", "opentelemetry-sdk>=1.25,<2", "opentelemetry-exporter-otlp>=1.25,<2", "prometheus-client>=0.20,<1"]
ai = ["sentence-transformers>=3,<6", "onnxruntime>=1.18,<2"]
parsing = ["drain3>=0.9,<1"]
all = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.7,<3", "aiokafka>=0.10,<1", "opentelemetry-api>=1.25,<2", "opentelemetry-sdk>=1.25,<2", "opentelemetry-exporter-otlp>=1.25,<2", "prometheus-client>=0.20,<1", "sentence-transformers>=3,<6", "onnxruntime>=1.18,<2", "drain3>=0.9,<1"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "ruff>=0.3.0", "mypy>=1.10.0", "bandit>=1.7.8", "pip-audit>=2.7.3", "pytest-benchmark>=4.0.0", "pip-licenses>=5.0.0"]

[project.scripts]
logsight = "logsight.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["logsight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers --cov=logsight --cov-report=term-missing --cov-report=xml --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["work"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["logsight"]
omit = ["tests/*", "logsight/api.py", "logsight/storage.py", "logsight/streaming.py", "logsight/observability.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__:\n"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["logsight"]
follow_imports = "skip"
disallow_untyped_decorators = false
ignore_missing_imports = true
warn_unused_ignores = false

[tool.bandit]
exclude_dirs = ["tests", "work"]
